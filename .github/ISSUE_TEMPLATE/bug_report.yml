name: Beta bug report
description: 报告安装、升级、数据安全或功能问题
title: "[Bug] "
labels: [bug, beta]
body:
  - type: markdown
    attributes:
      value: |
        请先删除 API Key、Cookie、私人内容和未脱敏本地路径。安全漏洞不要使用公开 Issue，请阅读 SECURITY.md。
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows x64
        - Linux / DSH Web
    validations:
      required: true
  - type: input
    id: host-version
    attributes:
      label: DSH Desktop / DeepSeek Harness 版本
      placeholder: DSH Desktop 2.0.2 / DSH 0.1.1-rc.2
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Jacky Creator 版本
      placeholder: v0.1.0-beta.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最短复现步骤
      description: 从打开应用开始，逐步说明如何稳定触发问题。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除密钥、Cookie、私人内容和可识别个人身份的信息。
          required: true
